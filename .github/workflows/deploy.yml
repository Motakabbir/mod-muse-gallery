name: Deploy to Server

on:
  push:
    branches:
      - main # Change to your default branch if it's different (e.g., master)

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }} # Usually 22
          script: |
            set -e

            # Navigate to your project directory on the server
            cd ${{ secrets.SERVER_TARGET_DIR }}
            
            # Pull the latest changes from the repository
            git pull origin main
            
            # Install dependencies
            npm install
            
            # Build the React/Vite project
            npm run build

            # Reload the SSR server so it references the assets from this build.
            pm2 startOrReload ecosystem.config.cjs --update-env
